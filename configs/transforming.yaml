TRANSACTIONS:
  SILVER_FILE: dvf_silver.csv

  SCHEMA: 
    id_mutation: String
    date_mutation: String
    numero_disposition: Int64
    nature_mutation: String
    valeur_fonciere: Float64
    adresse_numero: String
    adresse_nom_voie: String
    code_postal: String
    code_commune: String
    nom_commune: String
    code_departement: String
    type_local: String
    surface_reelle_bati: Float64
    nombre_pieces_principales: Int64
    address_inferred_from_coords: String
    is_valeur_fonciere_missing: Boolean
    is_surface_missing: Boolean
    is_nombre_pieces_missing: Boolean
    is_surface_tres_faible: Boolean
    is_valeur_fonciere_tres_basse: Boolean
    is_appartement_sans_lot: Boolean
    is_transaction_atypique_agent: Boolean

  KEY: [id_mutation, numero_disposition]

  PRIX_M2:
    VF: valeur_fonciere
    SR: surface_reelle_bati
    ST: surface_totale
    NEW_COL: prix_m2
    JOIN:
      DROP_COLS: valeur_fonciere
  
  TYPE_BIENS:
    TYPE: type_local
    NOMBRE: nb_biens
    TYPE_UNIQUE: type_biens_unique
    TYPE_PRINC: type_bien_principal
  
    FLAG_TYPE_BIENS:
      has_appartement: [type_biens_unique, Appartement]
      has_maison: [type_biens_unique, Maison]
      has_dependance: [type_biens_unique, Dépendance]

    APPT:
      KEY: Appartement
      VAL: [Appartement, Dépendance]
    MAI:
      KEY: Maison
      VAL: [Maison, Dépendance]
    MIX:
      KEY: Mixte
      VAL: [Appartement, Maison, Dépendance]
    CPLX:
      KEY: Indisponible
      VAL: Complex

  MARKET_METRICS:
    KEY: [code_postal, type_bien_principal, annee]

    COUNT:
      id_mutation: nb_transactions
    MEAN:
      prix_m2: prix_m2_mean
      valeur_fonciere: valeur_fonciere_mean
      surface_totale: surface_totale_mean
    MEDIAN:
      prix_m2: prix_m2_median
      valeur_fonciere: valeur_fonciere_median
      surface_totale: surface_totale_median
    QUANTILE:
      prix_m2_q25: [0.25, prix_m2]
      prix_m2_q75: [0.75, prix_m2]
  
  COLS_TO_KEEP: [
    id_mutation,
    date_mutation,
    annee,
    numero_disposition,
    nature_mutation,
    valeur_fonciere,
    prix_m2,
    adresse_numero,
    adresse_nom_voie,
    code_postal,
    type_local,
    type_bien_principal,
    surface_reelle_bati,
    surface_totale,
    nombre_pieces_principales,
    has_appartement,
    has_maison,
    has_dependance
    ]
  
  GOLD_FILE_TR: transactions.csv

  GOLD_FILE_MM: market_metrics.csv


EQUIPEMENTS:
  SILVER_FILE: bpe_silver.csv

  SCHEMA:
    annee: Int64
    code_postal: String
    classification_n1: String 
    classification_n2: String
    classification_n3: String
    nombre_equipements: Int64

  COUNT:
    CN1: classification_n1
    CN2: classification_n2
    CN3: classification_n3
    FIXED_VAL: Total
    INIT_COL: nombre_equipements
    NEW_COLS:
      nb_sante: Santé et action sociale
      nb_enseignement: Enseignement
      nb_transports: Transports et déplacements
      nb_commerces: Commerces
      nb_sports_loisirs: Sports, loisirs et culture
    EXCEPTION:
      nb_services_publics: Services publics
    
  KEY: [annee, code_postal]

  EQUIP_COLS: [
    nb_sante,
    nb_enseignement,
    nb_services_publics,
    nb_transports,
    nb_commerces,
    nb_sports_loisirs
  ]

  SURFACE_DATA:
    code_postal: ["75001","75002","75003","75004","75005","75006","75007","75008","75009","75010","75011","75012","75013","75014","75015","75016","75017","75018","75019","75020"]
    surface_km2: [1.824613, 0.991154, 1.170883, 1.600586, 2.539375, 2.153096, 4.090057, 3.880036, 2.178303, 2.891739, 3.665442, 16.314783, 7.149311, 5.614877, 8.494994, 16.372542, 5.668835, 5.996051, 6.792651, 5.983446]

  SCORE_WEIGHTS:
    nb_sante: 0.25
    nb_enseignement: 0.20
    nb_transports: 0.20
    nb_commerces: 0.15
    nb_sports_loisirs: 0.10
    nb_services_publics: 0.10

  GOLD_FILE_LF: location_features.csv